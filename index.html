<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Send things to people within earshot. No app, no install, no server." />
    <title>Earshot</title>
    <meta name="theme-color" content="#5b3df5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <header class="top">
      <h1><img class="logo" src="/icons/icon.svg" alt="" width="28" height="28" />Earshot</h1>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="send" aria-selected="true">Send</button>
        <button role="tab" data-tab="listen" aria-selected="false">Listen</button>
      </nav>
    </header>

    <main>
      <section id="tab-send" role="tabpanel">
        <div class="type-picker" id="type-picker"></div>
        <form id="send-form"><div id="send-fields"></div></form>
        <p class="meter"><span id="detected"></span><span id="size"></span></p>
        <div class="send-buttons">
          <button id="send-btn" class="primary big" disabled>Send</button>
          <button id="broadcast-btn" class="big" disabled>Broadcast</button>
        </div>
        <p class="hint" id="tx-status" aria-live="polite"></p>
        <p class="hint">Turn your volume up and hold the phones within a meter or two. Broadcast repeats until you stop it, so anyone nearby can tune in.</p>
      </section>

      <section id="tab-listen" role="tabpanel" hidden>
        <button id="listen-btn" class="primary big">Start listening</button>
        <canvas id="spectrogram" aria-label="Live spectrogram of the microphone"></canvas>
        <p class="hint" id="listen-hint">Received messages appear here. Nothing opens or downloads without a tap.</p>
        <div id="cards"></div>
      </section>

      <details id="settings">
        <summary>Settings &amp; debug</summary>
        <label><span>Transmit mode</span><select id="mode"></select></label>
        <label><span>Volume <output id="volume-out"></output></span><input id="volume" type="range" min="5" max="100" step="5" /></label>
        <h3>Debug</h3>
        <pre id="debug"></pre>
      </details>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
